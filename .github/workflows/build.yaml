name: build, test and deploy
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SERVER_URL: ${{ secrets.SERVER_URL }}
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  NAME: cashbook

jobs:
  build-frontend:
    name: build client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4
                
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install pnpm
        run: npm install -g pnpm

      - name: replace server url
        run: sed -i "s|SERVER_URL|${{ env.SERVER_URL }}|g" ./client/src/environments/environment.ts

      - run: pnpm install
        working-directory: ./client

      - run: pnpm build
        working-directory: ./client
        
      - run: pnpm lint
        working-directory: ./client
        
      # - run: pnpm pw:install
      #   working-directory: ./client

      # - run: pnpm pw
      #   working-directory: ./client

      # - uses: actions/upload-artifact@v3
      #   if: always()
      #   with:
      #     name: playwright-report
      #     path: playwright-report
      #     retention-days: 10
      #   working-directory: ./client

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.NAME }}-client

      - name: log in to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.NAME }}-client:latest
          platforms: linux/arm64

  build-backend:
    name: build server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: dotnet restore
        run: dotnet restore

      - name: dotnet build
        run: dotnet build --no-restore

      - name: install trx2junit
        run: dotnet tool install --global trx2junit

      - name: dotnet test unittests
        run: dotnet test --test-modules "Server/Tests/**/bin/Debug/net10.0/*UnitTests.dll" --no-restore --coverage --coverage-output-format cobertura --report-trx --results-directory ./UnitTestResults

      - name: run trx2junit for unittests
        run: trx2junit --output UnitTestResults/junit UnitTestResults/*.trx

      - name: Upload unittest results to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          report_type: test_results
          files: ./UnitTestResults/junit/*.xml
          flags: backend,unit-tests

      - name: Upload unittest coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./UnitTestResults/*.xml
          flags: backend,unit-tests

      - name: dotnet test integrationtests
        run: |
          export ConnectionStrings__AppDbContext="Server=localhost;Port=5432;Database=test;User Id=test;Password=test;"
          export Jwt__Key="ThisIsMySuperSecretKeyWhichNeedsToBeASpecificLengthForSomeReason"
          export Jwt__Issuer="test.de"
          export Jwt__Audience="test.de"
          dotnet test --test-modules "Server/Tests/**/bin/Debug/net10.0/*IntegrationTests.dll" --no-restore --coverage --coverage-output-format cobertura --report-trx --results-directory ./IntegrationTestResults
          
      - name: run trx2junit for integrationtests
        run: trx2junit --output IntegrationTestResults/junit IntegrationTestResults/*.trx

      - name: Upload integrationtest results to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          report_type: test_results
          files: ./IntegrationTestResults/junit/*.xml
          flags: backend,integration-tests

      - name: Upload integrationtest coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./IntegrationTestResults/*.xml
          flags: backend,integration-tests

      - name: log in to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.NAME }}-api:latest
          platforms: linux/arm64
